<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Manga Tracer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <button id="generate-btn" title="Generate New Character">
            <img src="magic-wand.png" alt="Generate" width="24" height="24">
        </button>
        
        <div class="tool-separator"></div>

        <div class="tool" title="Brush Color">
            <input type="color" id="color-picker" value="#FF007F">
        </div>
        
        <div class="tool brush-tool" title="Brush Size">
            <img src="brush-icon.png" alt="Brush Size" class="tool-icon">
            <div class="brush-size-control">
                <button id="brush-size-down" aria-label="Decrease brush size">-</button>
                <input type="number" id="brush-size-input" value="5" min="1" max="50" aria-label="Brush size">
                <button id="brush-size-up" aria-label="Increase brush size">+</button>
            </div>
        </div>

        <button id="clear-btn" title="Clear Tracing">
            <img src="trash-can.png" alt="Clear" width="24" height="24">
        </button>

        <div class="tool-separator"></div>

        <a id="download-btn" href="#" download="my-manga-tracing.png" title="Download Tracing">
             <img src="download-icon.png" alt="Download" width="24" height="24">
        </a>
    </div>

    <div id="canvas-container">
        <img id="reference-image" src="placeholder.png" alt="AI Generated Manga Character">
        <canvas id="drawing-canvas"></canvas>
        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <p>Generating your character...</p>
        </div>
    </div>
    
    <script type="importmap">
      {
        "imports": {
          "canvas-confetti": "https://cdn.skypack.dev/canvas-confetti"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
